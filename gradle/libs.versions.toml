[versions]
android-gradle-plugin = "9.2.1"
jetbrains-kotlinx-binary-compatibility-validator = "0.18.1"
github-ben-manes-versions = "0.54.0"
github-gmazzo-buildconfig = "6.0.10"
jetbrains-dokka = "2.2.0"
gradle-plugin-publish = "2.1.1"
google-code-gson = "2.13.2"
junit-jupiter = "5.14.4"
jetbrains-kotlin = "2.4.0"
jetbrains-kotlinx-serialization = "2.4.0"
google-devtools-ksp = "2.3.9"
littlerobots-version-catalog-update = "1.1.0"
yaml-snakeyaml = "2.6"
diffplug-spotless = "8.6.0"
vanniktech-maven-publish = "0.36.0"

[libraries]
jetbrains-kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "jetbrains-kotlin" }
google-devtools-ksp-gradle-plugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "google-devtools-ksp" }
google-code-gson = { module = "com.google.code.gson:gson", version.ref = "google-code-gson" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
jetbrains-kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "jetbrains-kotlinx-serialization" }
jetbrains-kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "jetbrains-kotlinx-serialization" }
vanniktech-maven-publish-api = { module = "com.vanniktech.maven.publish.base:com.vanniktech.maven.publish.base.gradle.plugin", version.ref = "vanniktech-maven-publish" }
yaml-snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "yaml-snakeyaml" }

[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
android-library = { id = "com.android.library", version.ref = "android-gradle-plugin" }
jetbrains-kotlinx-binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "jetbrains-kotlinx-binary-compatibility-validator" }
github-ben-manes-versions = { id = "com.github.ben-manes.versions", version.ref = "github-ben-manes-versions" }
github-gmazzo-buildconfig = { id = "com.github.gmazzo.buildconfig", version.ref = "github-gmazzo-buildconfig" }
gradle-plugin-publish = { id = "com.gradle.plugin-publish", version.ref = "gradle-plugin-publish" }
jetbrains-dokka = { id = "org.jetbrains.dokka", version.ref = "jetbrains-dokka" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "jetbrains-kotlin" }
jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "jetbrains-kotlin" }
jetbrains-kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "jetbrains-kotlin" }
jetbrains-kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "jetbrains-kotlin" }
google-devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "google-devtools-ksp" }
littlerobots-version-catalog-update = { id = "nl.littlerobots.version-catalog-update", version.ref = "littlerobots-version-catalog-update" }
diffplug-spotless = { id = "com.diffplug.spotless", version.ref = "diffplug-spotless" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-maven-publish" }
